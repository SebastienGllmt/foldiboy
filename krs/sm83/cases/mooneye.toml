# The mooneye acceptance ROMs that need only the CPU, RAM, IE and IF, on a DMG in the CPU stage.
# run-mooneye-tests.sh builds the ROMs into ../results/mooneye/ and runs these cases with krs cases.
#
# Each case starts from its cartridge as the boot ROM leaves it (Boot, src/boot.rs). A mooneye
# test ends by setting B C D E H L and looping on itself (`jr` to itself): 3 5 8 13 21 34 is a pass,
# all $42 a failure. No rule marks that end and the machine never stops, so a run is bounded by its
# rewrite steps, a count past the point where every ROM here reaches its loop, and the expectation
# states that end (`depth-bound`). The expectation compares only the registers, under the view that
# keeps B C D E H L (krs/sm83-views); A is stated as 0 and never compared.
#
# Counting instruction boundaries instead (stop before a boundary rule, `stop_count`) would state
# the end better, but at k-rust 2026-11-05 it costs time quadratic in the count (Foldiboy request
# FB-25).

[run]
depth = 100000

[[case]]
name = "ei_sequence"
[case.inputs]
start = { "$call" = { Boot = { cartridge = { "$file" = "../results/mooneye/acceptance/ei_sequence.gb" } } } }
[case.expect]
halt = "depth-bound"
compare = ["regs"]
views = { regs = "MooneyeResult" }
observer = "foldiboy-sm83-views:views"
cells = { regs = { A = 0, B = 3, C = 5, D = 8, E = 13, H = 21, L = 34 } }

