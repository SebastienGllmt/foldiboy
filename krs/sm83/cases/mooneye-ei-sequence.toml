# A ROM case on a DMG in the CPU stage: every input is the specification's boot state (src/boot.rs) or the cartridge.
# The ROM is the one run-mooneye-tests.sh builds. Run:
#   krs run --manifest-path Cargo.toml --package foldiboy-sm83 --definition main \
#     --dependency foldiboy-sm83-core:core --dependency foldiboy-sm83-events:events \
#     --case cases/mooneye-ei-sequence.toml --depth 20000
# It ends looping at $4AB5 with B C D E H L = 3 5 8 13 21 34, mooneye's pass.
[inputs]
regs = { "$call" = { DmgRegisters = [] } }
f = { "$call" = { DmgFlags = [] } }
pc = { "$call" = { BootPc = [] } }
sp = { "$call" = { BootSp = [] } }
ime = false
ei_pending = false
halted = false
halt_bug = false
w = 0
z = 0
rom = { "$call" = { RomRegion = { cartridge = { "$file" = "../results/mooneye/acceptance/ei_sequence.gb" } } } }
memory = { "$call" = { CpuStageIo = [] } }
