[package]
name = "sm83-rust-cpu"
description = "Runs the Rust emulator's CPU on a corpus case and writes its end as a krs end document"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
# Only to build a case's initial state: the case's inputs call the specification's functions.
krs-exec = { path = "/artifacts/worktrees/k-rust-foldiboy-pin/krs/crates/krs-exec" }
krs-ir = { path = "/artifacts/worktrees/k-rust-foldiboy-pin/krs/crates/krs-ir" }
krs-ir-levels = { path = "/artifacts/worktrees/k-rust-foldiboy-pin/krs/crates/krs-ir-levels" }
serde_json = "1.0"
cpu = { path = "../../lib/crates/cpu" }
memory = { path = "../../lib/crates/memory" }

[workspace]
resolver = "3"
