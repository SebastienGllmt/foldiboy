[package]
name = "sm83-rust-cpu"
description = "Runs the Rust emulator's CPU on a corpus case and writes its end as a krs end document"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
serde_json = "1.0"
cpu = { path = "../../lib/crates/cpu" }
memory = { path = "../../lib/crates/memory" }

[workspace]
resolver = "3"
