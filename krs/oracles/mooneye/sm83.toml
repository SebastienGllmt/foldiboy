# The mooneye acceptance ROMs that need only the CPU, RAM, IE and IF, on a DMG in the CPU stage.
# `bun run mooneye` builds the ROMs beside this file (scripts/roms.ts) and runs these cases with krs cases.
#
# Each case starts from its cartridge as the boot ROM leaves it (src/boot.rs), and the rest of the
# console requests no interrupt (these tests need none). A mooneye test ends in its quit routine: it
# sets B C D E H L (3 5 8 13 21 34 is a pass, all $42 a failure) and executes `LD B,B`, mooneye's
# breakpoint, then sends the registers over serial and loops.
# One decode rule covers every `LD r,r`, so no rule marks that end: a run stops before the first
# fetch whose opcode is $40 (`stop_when`, MooneyeBreakpoint in krs/sm83-views), and the expectation
# compares only the registers there, under the view that keeps B C D E H L (krs/sm83-views); A is
# stated as 0 and never compared. The depth is a budget: a run that reaches it is inconclusive.

[run]
stop_before = ["crate::interrupt::boundary_fetch"]
stop_when = { function = "MooneyeBreakpoint", cells = ["pc", "rom_end", "rom"], observer = "foldiboy-sm83-views:views" }
depth = 10000000

[[case]]
name = "ei_sequence"
[case.inputs]
cartridge = { "$file" = "ei_sequence.gb" }
requests = []
[case.expect]
halt = "stopped"
rule = "crate::interrupt::boundary_fetch"
compare = ["regs"]
views = { regs = "MooneyeResult" }
observer = "foldiboy-sm83-views:views"
cells = { regs = { A = 0, B = 3, C = 5, D = 8, E = 13, H = 21, L = 34 } }

