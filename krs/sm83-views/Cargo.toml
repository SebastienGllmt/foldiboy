[package]
name = "foldiboy-sm83-views"
description = "Views of the SM83 definition's cells: what a comparison observes of a cell"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
sm83 = { package = "foldiboy-sm83", path = "../sm83" }
sm83-events = { package = "foldiboy-sm83-events", path = "../sm83-events" }
k = { package = "krs", path = "/artifacts/worktrees/k-rust-pin-db7063a30/krs/crates/krs" }

[package.metadata.krs]
k-namespace = "SM83-VIEWS"

[package.metadata.krs.definitions.views]

[workspace]
# The corpus's patterns package is outside the definition's closure and inside this graph, which
# `krs kink` resolves (scripts/krs.ts).
members = ["../sm83-patterns"]
resolver = "3"
