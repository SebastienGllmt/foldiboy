# The corpus as kink's corpus for the SM83 definition (krs/sm83, facet main; sm83-refactor R8):
# `krs kink <verb>` runs every case against the definition and its mutations (mutations/*.toml,
# K patches of definition.k anchored by KRS item). kink compares a mutant's end with the
# definition's on every cell the definition does not declare unobservable (W and Z).
# `bun run kink VERB` builds the cartridges first; each cartridge is a case.

[spec]
krs = { definition = "main" }

[budget]
time_ms = 30000
max_depth = 200000
work_factor = 4

# A case in cases/ is a cartridge, and the rest of the console requests no interrupt. A case in
# scheduled/ is a case document: its cartridge and the requests (the CPU stage's REQUESTS input).
[[program]]
files = "cases/*/case.gb"
inputs = { requests = [] }

[[program]]
cases = "scheduled/*/case.toml"

# A case ends by locking the CPU, except one that enters HALT mode with nothing to wake it: its run
# ends at its second halted boundary (the first one idles). No other case reaches one.
[stop]
before = ["crate::interrupt::boundary_halted"]
count = 2

# Every run is also compared at each instruction boundary on where the instruction stream goes
# and on the interrupt and HALT state, so a mutant whose run never ends (it re-fetches one
# opcode, or never dispatches) is told apart where it first differs, not left unknown.
[[observe.point]]
name = "boundary"
before = ["crate::interrupt::boundary_dispatch", "crate::interrupt::boundary_fetch", "crate::interrupt::boundary_halted", "crate::interrupt::boundary_wake"]
stutter = "count"
cells = ["pc", "ime", "halted"]

# Six ROM-side requirements no case can reach: `memory` never holds a ROM address, since a write
# into the ROM region stores nothing (the rom-write case). The rules that read `memory` carry
# `!InRom` guards only so that krs's overlap check sees them disjoint from their ROM-side twins,
# so their ROM-side outcomes are argued. kink checks each argument: the invariant excludes the
# outcome at the rule's pattern (one solver query), and it holds at every state of every run
# where those rules could apply.
[[coverage.invariant]]
name = "memory-outside-rom"
function = "crate::machine::MemoryOutsideRom"
cells = ["memory", "rom_end"]

[[coverage.argued]]
item = "requirement:crate::micro::fetch:InRom(rom_end, pc):true"
argument = "memory never holds a ROM address, so fetch from memory never sees pc in ROM"
invariant = "memory-outside-rom"

[[coverage.argued]]
item = "requirement:crate::micro::fetch_halt_bug:InRom(rom_end, pc):true"
argument = "memory never holds a ROM address, so the HALT-bug fetch from memory never sees pc in ROM"
invariant = "memory-outside-rom"

[[coverage.argued]]
item = "requirement:crate::interrupt::discard_fetch:refuted"
argument = "memory never holds a ROM address, so the discarded fetch from memory never sees pc in ROM"
invariant = "memory-outside-rom"

[[coverage.argued]]
item = "requirement:crate::micro::fetch_cb:refuted"
argument = "memory never holds a ROM address, so the CB fetch from memory never sees pc in ROM"
invariant = "memory-outside-rom"

[[coverage.argued]]
item = "requirement:crate::micro::read_w:refuted"
argument = "memory never holds a ROM address, so a read into W from memory never sees a ROM address"
invariant = "memory-outside-rom"

[[coverage.argued]]
item = "requirement:crate::micro::read_z:refuted"
argument = "memory never holds a ROM address, so a read into Z from memory never sees a ROM address"
invariant = "memory-outside-rom"
