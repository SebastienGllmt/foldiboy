artifacts = "krs/sm83/results/decoder-cleanup-2026-10-30 (ignored): exact domain and field audits, successful native and Lean runs, costs, and separately archived unsuccessful compact attempts."
resolved_prompt_removed = "machine-docs/prompts/k2lean-sm83-decoder-proofs.md"

[cost]
